[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gtfs-hub-gzm"
version = "0.1.0"
description = "GZM provider for gtfs-hub"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "grozycki" }]
keywords = ["gtfs", "gtfs-realtime", "public-transport", "gzm", "katowice", "silesia"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["aiohttp>=3.10", "gtfs-hub>=0.1,<0.2"]

[project.urls]
Homepage = "https://github.com/grozycki/gtfs-hub-gzm"
Issues = "https://github.com/grozycki/gtfs-hub-gzm/issues"
Changelog = "https://github.com/grozycki/gtfs-hub-gzm/blob/main/CHANGELOG.md"

[project.entry-points."gtfs_hub.providers"]
gzm = "gtfs_hub_gzm:GzmProvider"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv.sources]
gtfs-hub = { path = "../gtfs-hub", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/gtfs_hub_gzm"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "TC", "PYI"]

[tool.mypy]
strict = true
files = ["src", "tests"]
warn_unreachable = true
disallow_any_explicit = true
disallow_any_unimported = true
enable_error_code = [
    "deprecated",
    "explicit-override",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "unused-awaitable",
]
